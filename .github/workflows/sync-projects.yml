name: Sync GitHub projects

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync-github-projects.mjs'
      - '.github/workflows/sync-projects.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate data/github-projects.json
        run: node scripts/sync-github-projects.mjs
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain data/github-projects.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/github-projects.json
            git commit -m "chore: sync GitHub projects"
            git push
          else
            echo "No changes"
          fi
